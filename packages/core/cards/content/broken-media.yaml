id: content/broken-media
priority: important
whoFixes: owner
effort: small
review: reviewed
passed:
  pl: Wszystkie obrazy i filmy na sprawdzonych podstronach się wczytują.
  en: All images and videos on the pages checked load.
pl:
  title: "{count} {count|obraz lub film się nie wczytuje|obrazy lub filmy się nie wczytują|obrazów lub filmów się nie wczytuje}"
  summary: W miejscu zdjęcia lub filmu klient widzi puste pole albo ikonę błędu.
  whatIsWrong: >
    Na sprawdzonych podstronach {count} {count|plik obrazu lub filmu się nie wczytuje|pliki obrazów lub filmów się nie wczytują|plików obrazów lub filmów się nie wczytuje}:
    serwer zwraca błąd albo pobieranie się nie udaje.
  whyItMatters: >
    Klient nie zobaczy zdjęć produktów czy realizacji, które miały go przekonać, a puste miejsca mogą
    sprawić, że strona wygląda na zaniedbaną.
  howToFix:
    - Sprawdź w załączniku technicznym, których plików dotyczy błąd i na jakich podstronach są używane.
    - Wgraj brakujące pliki ponownie w panelu strony albo usuń je z podstron, jeśli nie są już potrzebne.
    - Przekaż developerowi pliki, które są częścią szablonu (np. tła i ikony) albo pochodzą z innych serwisów.
  short: >
    Na sprawdzonych podstronach {count} {count|plik obrazu lub filmu zwraca|pliki obrazów lub filmów zwracają|plików obrazów lub filmów zwraca}
    błąd. Wgraj brakujące pliki ponownie albo usuń je z podstron.
  technical: >
    Żądania typu image lub media z kodem HTTP 400 lub wyższym albo nieudane: {count}
    {count|adres|adresy|adresów}. Przykłady (adres → status):
en:
  title: "{count} {count|image or video does|images or videos do} not load"
  summary: Customers see an empty box or an error icon where an image or video should be.
  whatIsWrong: >
    On the pages checked, {count} image or video {count|file does|files do} not load: the server
    returns an error or the download fails.
  whyItMatters: >
    Customers do not see the photos of your products or work that were meant to convince them, and the
    empty spaces can make the site look neglected.
  howToFix:
    - Check in the technical appendix which files fail and on which pages they are used.
    - Upload the missing files again in the admin panel, or remove them from the pages if they are no longer needed.
    - Pass files that belong to the site template (e.g. backgrounds and icons) or come from other services to the developer.
  short: >
    On the pages checked, {count} image or video {count|file returns|files return} an error. Upload
    the missing files again or remove them from the pages.
  technical: >
    Requests of type image or media with HTTP status 400 or higher, or failed: {count}
    {count|URL|URLs}. Examples (URL → status):
