id: a11y/contrast
priority: important
whoFixes: developer
effort: small
review: reviewed
passed:
  pl: Tekst ma wystarczający kontrast z tłem.
  en: Text has enough contrast with its background.
pl:
  title: Część tekstu słabo odcina się od tła
  summary: Tekst zlewa się z tłem, więc trudno go przeczytać, zwłaszcza na telefonie w słońcu.
  whatIsWrong: >
    Na sprawdzonych podstronach {count} {count|fragment tekstu ma|fragmenty tekstu mają|fragmentów tekstu ma}
    za mały kontrast z tłem. Wytyczne WCAG wymagają co najmniej 4,5:1 dla zwykłego tekstu i 3:1 dla dużego.
  whyItMatters: >
    Taki tekst trudno przeczytać osobom słabowidzącym i starszym, bo z wiekiem oko gorzej rozróżnia
    kontrast. Na telefonie w ostrym słońcu słaby kontrast utrudnia czytanie każdemu.
  howToFix:
    - Zmień kolor tekstu albo tła tak, żeby kontrast wynosił co najmniej 4,5:1, a dla dużego tekstu co najmniej 3:1.
    - Popraw kolory w stylach całej strony, a nie na pojedynczych podstronach. Zacznij od miejsc wymienionych w załączniku technicznym.
    - Tekst na zdjęciach sprawdź samodzielnie, bo automatyczny test nie mierzy kontrastu na tle zdjęcia.
  short: >
    {count} {count|fragment tekstu ma|fragmenty tekstu mają|fragmentów tekstu ma} za słaby kontrast
    z tłem. Zmień kolor tekstu lub tła tak, żeby kontrast wynosił co najmniej 4,5:1 (3:1 dla dużego tekstu).
  technical: >
    axe: {rules}. {count} {count|element|elementy|elementów} poniżej progu WCAG 1.4.3: 4,5:1, a dla
    dużego tekstu (od 24 px albo od ok. 18,5 px pogrubionego) 3:1. Tekst na obrazach tła axe oznacza
    do ręcznego sprawdzenia, więc nie jest tu liczony.
en:
  title: Some text barely stands out from its background
  summary: Text blends into the background, so it is hard to read, especially on a phone in sunlight.
  whatIsWrong: >
    On the pages checked, {count} {count|piece of text has|pieces of text have} too little contrast
    with the background. WCAG requires at least 4.5:1 for normal text and 3:1 for large text.
  whyItMatters: >
    Such text is hard to read for people with low vision and for older people, because sensitivity to
    contrast declines with age. On a phone in bright sunlight, weak contrast makes reading hard for anyone.
  howToFix:
    - Change the text or background colour so the contrast is at least 4.5:1, or at least 3:1 for large text.
    - Fix the colours in the site-wide styles rather than page by page. Start with the places listed in the technical appendix.
    - Check text over photos yourself, because the automated test does not measure contrast against a photo.
  short: >
    {count} {count|piece of text has|pieces of text have} too little contrast with the background.
    Change the text or background colour to reach at least 4.5:1 (3:1 for large text).
  technical: >
    axe: {rules}. {count} {count|element|elements} below the WCAG 1.4.3 threshold: 4.5:1, or 3:1 for
    large text (24 px and up, or about 18.5 px and up if bold). axe marks text over background images
    for manual review, so it is not counted here.
